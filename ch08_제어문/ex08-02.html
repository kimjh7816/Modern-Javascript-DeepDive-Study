<script>
    var num = 2;
    var kind;

    // if ... else if 문
    if (num > 0) {
        kind = '양수';
    }
    else if (num < 0) {
        kind = '음수';
    }
    else {
        kind = '영';
    }
    console.log(kind);

    // 삼항 조건 연산자로 바꿔 쓴 경우
    kind = num ? (num > 0 ? '양수' : '음수') : '영';
    console.log(kind);
</script>
