<script>
    var string = 'Hello World.';
    var search = 'l';
    var index;

    for (var i = 0; i < string.length; i++) {
        if (string[i] === search) {
            index = i;
            break;
        }
    }

    document.write(index);
    document.write(string.indexOf(search)); // 인덱스를 구하는 메서드
</script>
